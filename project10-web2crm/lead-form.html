<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>ЗооПульт — заявка</title>
  <style>
    body { font-family: sans-serif; max-width: 560px; margin: 3rem auto; padding: 0 1rem; }
    .card { border: 1px solid #ddd; border-radius: 12px; padding: 2rem; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input, textarea { width: 100%; margin-top: .3rem; padding: .6rem; border: 1px solid #ccc; border-radius: 8px; font: inherit; }
    button { margin-top: 1.5rem; padding: .7rem 1.6rem; background: #1a7f37; color: #fff; border: 0; border-radius: 8px; font-size: 1rem; cursor: pointer; }
    button:hover { background: #146a2d; }
    #ok { margin-top: 1rem; color: #1a7f37; font-weight: 600; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Заявка на співпрацю</h2>
    <p>Залиште заявку — менеджер зв’яжеться з вами.</p>
    <form id="leadForm">
      <label>Ваше ім’я</label>
      <input name="name" required placeholder="Іван Петренко">
      <label>Телефон</label>
      <input name="phone" required placeholder="+38 0__ ___ __ __">
      <label>Назва магазину</label>
      <input name="store" placeholder="Зоомагазин «Лапа»">
      <label>Місто</label>
      <input name="city" placeholder="Кривий Ріг">
      <label>Повідомлення</label>
      <textarea name="message" rows="4" placeholder="Хочемо замовити корми оптом, розглядаємо 2–3 постачальників"></textarea>
      <button type="submit">Надіслати</button>
      <div id="ok">✅ Заявку прийнято! Менеджер зв’яжеться з вами.</div>
    </form>
  </div>
  <script>
    const form = document.getElementById('leadForm');
    const ok = document.getElementById('ok');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form).entries());
      const resp = await fetch('http://127.0.0.1:8793/lead', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      const result = await resp.json();
      if (result.ok) { ok.style.display = 'block'; form.reset(); }
      else alert('Помилка: ' + (result.error || 'спробуйте пізніше'));
    });
  </script>
</body>
</html>
